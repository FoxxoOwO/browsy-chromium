<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doplňky - Browsy Chromium</title>
  <style>
    :root {
      --bg: #111116;
      --card-bg: #1c1c24;
      --border: #2a2a38;
      --text: #f3f4f6;
      --text-muted: #8b8ea4;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 40px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .action-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .banner-compat {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .banner-icon {
      font-size: 32px;
    }

    .banner-text h3 {
      font-size: 14px;
      font-weight: 600;
      color: #a5b4fc;
    }

    .banner-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .extensions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .ext-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
    }

    .ext-card:hover {
      border-color: #3f3f55;
    }

    .ext-card-top {
      display: flex;
      gap: 14px;
    }

    .ext-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background-color: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .ext-meta {
      flex: 1;
      overflow: hidden;
    }

    .ext-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .ext-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ext-ver {
      font-size: 11px;
      color: var(--text-muted);
    }

    .ext-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ext-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-builtin {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .tag-firefox {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .tag-chrome {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .tag-mv2 {
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .ext-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333344; transition: 0.2s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: 0.2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    .btn-danger {
      background: transparent;
      border: 1px solid #4a2525;
      color: #f87171;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background: #3b1818;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span style="font-size: 28px;">🧩</span>
      <h1>Správa doplňků (Chrome & Firefox)</h1>
    </div>
    <div class="action-group">
      <button id="btn-install" class="btn btn-primary">
        <span>➕ Nainstalovat doplněk (.crx / .xpi / .zip)</span>
      </button>
    </div>
  </div>

  <div class="banner-compat">
    <div class="banner-icon">🛡️</div>
    <div class="banner-text">
      <h3>Plná podpora Manifest V2 a Firefox WebExtensions (.xpi)</h3>
      <p>Tento prohlížeč zachovává nativní podporu pro doplňky Manifest V2 i moderní Manifest V3. Soubory doplňků z Firefoxu (.xpi) jsou automaticky adaptovány s podporou API <code>browser.*</code>.</p>
    </div>
  </div>

  <div id="extensions-container" class="extensions-grid">
    <!-- Dynamic Cards -->
  </div>

  <script src="extensions.js"></script>
</body>
</html>
